name: Build TRIKA.TRAD APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          sudo apt update
          sudo apt install -y zip unzip git autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev cmake openjdk-17-jdk
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 Cython==0.29.36
      - run: cp "TRIKA.TRAD.py" "main.py"
      - env:
          BUILDOZER_ALLOW_ROOT: "1"
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TRIKA_TRAD_APK
          path: bin/*.apk
